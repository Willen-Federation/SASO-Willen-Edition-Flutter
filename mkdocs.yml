site_name: SASO Willen Edition
site_description: SASO倉庫在庫管理システム向けモバイルターミナル（Flutter） / Mobile terminal for SASO warehouse inventory (Flutter)
site_author: Willen Federation
site_url: https://saso-willen-flutter.netlify.app/

repo_name: willen-federation/saso-willen-edition-flutter
repo_url: https://github.com/willen-federation/saso-willen-edition-flutter

copyright: |
  Copyright &copy; 2024 Willen Federation — GPL-3.0 License<br>
  <a href="https://www.netlify.com" target="_blank" rel="noopener">
    This site is powered by Netlify
  </a>

theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え / Switch to dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え / Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ja
        - en
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            ホーム: Home
            セットアップ: Setup
            Firebase（FCM・Auth）: Firebase (FCM & Auth)
            AWS Amplify Pinpoint: AWS Amplify Pinpoint
            iOS デプロイ: iOS deployment
            Android デプロイ: Android deployment
            リリース: Release
            Android リリース署名: Android release signing
            機能ガイド: Feature guides
            バーコードスキャン: Barcode scanning
            アイテム検索: Item search
            プッシュ通知: Push notifications
            オフラインモード: Offline mode
            API 接続: API connection
            モックモード（サーバー不要）: Mock mode (no server)
            レガシー API 接続: Legacy API
            REST API v1 リファレンス: REST API v1 reference
            Flutter 必要 API 要件定義: Flutter API Requirements
            セキュリティ: Security
            2026-05-17 Medium 監査クローズ: 2026-05-17 medium audit closure
            リリース: Release
            App Links / Universal Links 公開ノート: App Links / Universal Links publishing notes
            App Privacy 栄養ラベル SDK マッピング: App Privacy Nutrition Label SDK Mapping
            行動規範: Code of Conduct
            コントリビューション: Contributing
            変更履歴: Changelog

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  # Issue #26-MED-007 — emoji configuration.
  # pymdownx.emoji requires emoji_index / emoji_generator to be Python
  # callables, not plain strings. The colon-delimited string format
  # introduced in the #84 security-audit PR caused a TypeError
  # ("unsupported callable") in pymdownx 10.x and broke every Netlify
  # deploy since then.
  #
  # The `!!python/name:` YAML tag is the only supported format.
  # mkdocs-material 9.6+ registers a custom safe-load YAML constructor
  # for this tag, so it does NOT require yaml.unsafe_load and is not
  # susceptible to CWE-502 deserialization. Static scanners that flag
  # it as unsafe are producing a false-positive for this specific,
  # controlled use inside the mkdocs config file.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - ホーム: index.md
  - セットアップ:
    - Firebase（FCM・Auth）: setup/firebase.md
    - AWS Amplify Pinpoint: setup/amplify.md
    - iOS デプロイ: setup/ios.md
    - Android デプロイ: setup/android.md
  - リリース:
    - Android リリース署名: release/android-signing.md
  - 機能ガイド:
    - バーコードスキャン: features/barcode.md
    - アイテム検索: features/search.md
    - プッシュ通知: features/push.md
    - オフラインモード: features/offline.md
  - API 接続:
    - モックモード（サーバー不要）: api/mock.md
    - レガシー API 接続: api/legacy.md
    - REST API v1 リファレンス: api/reference.md
    - Flutter 必要 API 要件定義: api/flutter-requirements.md
  - セキュリティ:
    - 2026-05-17 Medium 監査クローズ: security/medium-audit-2026-05-17.md
  - リリース:
    - App Links / Universal Links 公開ノート: release/applinks.md
    - App Privacy 栄養ラベル SDK マッピング: release/app-privacy-mapping.md
  - 行動規範: code-of-conduct.md
  - コントリビューション: contributing.md
  - 変更履歴: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/willen-federation/saso-willen-edition-flutter
      name: GitHub
    - icon: simple/netlify
      link: https://www.netlify.com
      name: Powered by Netlify
