include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore
    # Phase C (PR-B4+): surface every in-tree use of `@Deprecated` members
    # — primarily `ApiMode.legacy`, `LegacyApiClient`, `LegacyAuthService`,
    # and `ServerConfig.sessionCookie`. Set to `info` (not warning/error)
    # so v2.5 still builds with legacy support; the 4 call sites that must
    # remain in v2.5 carry explicit `// ignore: deprecated_member_use_from_same_package`
    # comments tagged with `TODO(v3.0)`. Any NEW use of these symbols will
    # also light up in analyzer output as a guidance signal.
    # See docs/v3-migration.md for the deletion roadmap.
    deprecated_member_use_from_same_package: info
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/generated/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_redundant_argument_values
    - avoid_relative_lib_imports
    - avoid_slow_async_io
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_single_quotes
    - require_trailing_commas
    - test_types_in_equals
    - throw_in_finally
    - use_build_context_synchronously
