name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Workflow-level default: read-only. The deploy job elevates to
# `contents: write` (gh-pages push) and `pages: write` (Pages API)
# locally.
permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy MkDocs
    runs-on: ubuntu-latest
    # Job-level elevation: only this job needs write access.
    permissions:
      contents: write
      pages: write

    steps:
      # Issue #26-MED-004 — third-party actions SHA-pinned. Dependabot
      # tracks these via .github/dependabot.yml (github-actions ecosystem).
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history required for git-revision-date-localized plugin (if added later)
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.x'
          cache: pip

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean --verbose
        env:
          # Ensures git config is set for the deploy commit
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
