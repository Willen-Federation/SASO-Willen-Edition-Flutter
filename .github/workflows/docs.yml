name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  # Allow manual trigger from the Actions tab — gated below so only
  # users with admin/maintain permission on this repo can dispatch.
  workflow_dispatch:

# Workflow-level default: read-only. The deploy job elevates to
# `contents: write` (gh-pages push) and `pages: write` (Pages API)
# locally.
permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy MkDocs
    runs-on: ubuntu-latest
    # Job-level elevation: only this job needs write access.
    permissions:
      contents: write
      pages: write

    steps:
      # Issue #33 — authz guard for workflow_dispatch.
      # Push events from `main` are always trusted (already protected by
      # branch protection). For manual dispatch we query the GitHub API
      # for the actor's repo permission and fail unless they have
      # `admin` or `maintain`. This prevents a user with `write` access
      # (enough to push to a feature branch) from also triggering a
      # production docs deploy by hand.
      - name: Authorize manual trigger
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          permission=$(gh api \
            "/repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" \
            --jq '.permission')
          case "$permission" in
            admin|maintain)
              echo "User ${{ github.actor }} authorized (permission=$permission)"
              ;;
            *)
              echo "::error::User ${{ github.actor }} (permission=$permission) is not authorized to dispatch this workflow. admin or maintain required."
              exit 1
              ;;
          esac

      # Issue #26-MED-004 — third-party actions SHA-pinned. Dependabot
      # tracks these via .github/dependabot.yml (github-actions ecosystem).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history required for git-revision-date-localized plugin (if added later)
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Deploy to GitHub Pages
        # Note: `--verbose` was removed (issue #37) — the flag leaks
        # plugin-internal paths and absolute repo paths into the public
        # CI log. Re-enable only when actively debugging a deploy.
        run: mkdocs gh-deploy --force --clean
        env:
          # Ensures git config is set for the deploy commit
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
