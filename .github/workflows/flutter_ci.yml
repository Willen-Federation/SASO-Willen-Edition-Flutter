name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Issue #26-MED-005 — workflow-level permissions block.
# Default every job to read-only `contents`. Jobs that need more
# (e.g. uploading coverage to codecov) elevate at the job level.
# Without this, GitHub's default token grants `contents: write` and
# `actions: write` to every job — a compromised dependency could push
# to the repo or modify other workflows.
permissions:
  contents: read

env:
  # NOTE: bumped to 3.44.0 (Dart 3.12.0) — the previous 3.29.2 pin
  # shipped Dart 3.7.2, which can't satisfy `cupertino_icons ^1.0.9`
  # (requires Dart ^3.9.0, introduced by PR #100). Verified present in
  # `subosito/flutter-action@v2`'s release catalog before bumping
  # (releases_linux.json). Keep this in sync with the local SDK the
  # maintainer ships with `flutter --version` whenever feasible.
  FLUTTER_VERSION: '3.44.0'

jobs:
  # Issue #26-MED-004 — third-party actions pinned to immutable SHAs
  # rather than mutable `@v4` / `@v2` tags. A compromised upstream
  # repo cannot retroactively swap the action body without changing
  # the SHA, which would trip the diff at PR-review time. SHAs below
  # match the named version; refresh on every dependency bump
  # (Dependabot handles this — see .github/dependabot.yml).
  analyze:
    name: Format & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/ integration_test/

      - name: Analyze
        run: flutter analyze

  test-unit:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: analyze
    # codecov upload requires `id-token: write` for OIDC auth.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        run: flutter test test/unit/ --coverage

      - name: Run widget tests
        run: flutter test test/widget/ --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: coverage/lcov.info
        continue-on-error: true

  build-ios:
    name: iOS Simulator Build
    runs-on: macos-15
    needs: analyze
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Flutter 3.32+ enables Swift Package Manager integration by
      # default. With it on, SPM-aware plugins (e.g. `mobile_scanner`)
      # link through SPM while `GeneratedPluginRegistrant.m` is still
      # emitted for CocoaPods, producing "Use of undeclared identifier
      # 'MobileScannerPlugin'" at compile time. Several other plugins
      # in this project (auth0_flutter, amplify_*) are CocoaPods-only,
      # so the consistent fix is to keep the whole iOS build on Pods.
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # The macos-15 runner's cached CocoaPods specs CDN snapshot is
      # too old to resolve current Firebase / Amplify podspecs (`pod
      # install` exits with "CocoaPods's specs repository is too
      # out-of-date"). `flutter build` invokes `pod install` without
      # `--repo-update`, so we run it ourselves first and let Flutter
      # reuse the fresh Pods/ output.
      - name: Pod install with repo refresh
        run: pod install --repo-update
        working-directory: ios

      - name: Build iOS simulator
        run: flutter build ios --simulator --debug --no-codesign

  # Integration tests run locally via `make test-integration`.
  # They require iPhone 17 (iOS 26.4) simulator UUID: 6220269A-82B9-4382-B652-952116BA7E80.
  # Uncomment and adjust simulator UUID to enable in CI on a self-hosted runner.
  #
  # test-integration:
  #   name: Integration Tests (iPhone 17)
  #   runs-on: [self-hosted, macOS, ios-simulator]
  #   needs: build-ios
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
  #       with:
  #         flutter-version: ${{ env.FLUTTER_VERSION }}
  #     - run: flutter pub get
  #     - run: dart run build_runner build --delete-conflicting-outputs
  #     - run: |
  #         flutter test integration_test/ \
  #           -d 6220269A-82B9-4382-B652-952116BA7E80 \
  #           --timeout 300s
