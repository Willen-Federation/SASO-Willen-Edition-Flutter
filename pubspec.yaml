name: saso_willen_edition
description: >
  SASO Willen Edition — Mobile terminal app for SASO inventory management.
  Handheld scanner/viewer for warehouse workers.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (Riverpod)
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3+1

  # Navigation
  go_router: ^17.2.3

  # Immutable models + JSON serialisation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # HTTP client (BSD-3 — GPL compatible)
  http: ^1.3.0

  # Local persistence
  sqflite: ^2.4.2
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^10.2.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Barcode scanning. 7.x dropped Google MLKit in favour of AVFoundation
  # / Vision on iOS, restoring arm64 simulator support on iOS 26+.
  mobile_scanner: ^7.2.0

  # Image capture & photo library access
  image_picker: ^1.1.2

  # Firebase (Apache 2.0 — GPL compatible)
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  firebase_auth: ^6.5.1
  firebase_remote_config: ^6.5.1

  # AWS Amplify / SNS Pinpoint (Apache 2.0 — GPL compatible) [ff_push_sns]
  amplify_flutter: ^2.0.0
  amplify_push_notifications_pinpoint: ^2.0.0

  # OIDC / OAuth2 [ff_auth_oidc]
  flutter_appauth: ^12.0.0

  # Auth0 native SDK [ff_auth_oidc + auth0 provider]
  auth0_flutter: ^2.0.2

  # Amazon Cognito native SDK via Amplify Auth [ff_auth_cognito]
  amplify_auth_cognito: ^2.0.0

  # SAML SSO WebView fallback
  webview_flutter: ^4.10.0

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1

  # Internationalisation
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.15.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1

  # Linting
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

  # Testing
  mocktail: ^1.0.4
  fake_async: ^1.3.2
  sqflite_common_ffi: ^2.3.0+4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/l10n/
