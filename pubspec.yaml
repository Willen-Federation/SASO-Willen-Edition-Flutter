name: saso_willen_edition
description: >
  SASO Willen Edition — Mobile terminal app for SASO inventory management.
  Handheld scanner/viewer for warehouse workers.
# Bumped to 1.0.0+1 for the initial App Store submission (Issue #138).
# `1.0.0` is CFBundleShortVersionString (marketing) and `+1` is
# CFBundleVersion (build). Both flow into Xcode via FLUTTER_BUILD_NAME /
# FLUTTER_BUILD_NUMBER — do not duplicate the values in project.pbxproj.
# See docs/release/versioning.md for the bump policy.
version: 1.0.0+1
publish_to: none

environment:
  # cupertino_icons 1.0.9 (PR #100) requires Dart ^3.9.0.
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (Riverpod 2.x).
  # PR #98 bumped the Riverpod stack to 3.x / riverpod_generator 4.x,
  # which renames generated providers (`xxxNotifierProvider` →
  # `xxxProvider`) and reshapes the override API. Pinned to 2.x until
  # the codebase migration to Riverpod 3 is scheduled.
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5

  # Navigation
  go_router: ^17.2.3

  # Immutable models + JSON serialisation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # HTTP client (BSD-3 — GPL compatible)
  http: ^1.3.0

  # SHA-256 for certificate pinning (BSD-3 — GPL compatible)
  crypto: ^3.0.0

  # Local persistence
  sqflite: ^2.4.2
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^10.3.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Barcode scanning. 7.x dropped Google MLKit in favour of AVFoundation
  # / Vision on iOS, restoring arm64 simulator support on iOS 26+.
  mobile_scanner: ^7.2.0

  # Image capture & photo library access
  image_picker: ^1.2.2

  # Firebase (Apache 2.0 — GPL compatible)
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  firebase_auth: ^6.5.1
  firebase_remote_config: ^6.5.1

  # AWS Amplify / SNS Pinpoint (Apache 2.0 — GPL compatible) [ff_push_sns]
  amplify_flutter: ^2.0.0
  amplify_push_notifications_pinpoint: ^2.0.0

  # OIDC / OAuth2 [ff_auth_oidc]
  flutter_appauth: ^12.0.1

  # Auth0 native SDK [ff_auth_oidc + auth0 provider]
  auth0_flutter: ^2.1.0

  # Amazon Cognito native SDK via Amplify Auth [ff_auth_cognito]
  amplify_auth_cognito: ^2.11.0

  # SAML SSO WebView fallback
  webview_flutter: ^4.10.0

  # UI
  cupertino_icons: ^1.0.9
  cached_network_image: ^3.4.1

  # Opens the web /mypage portal for device-token management.
  url_launcher: ^6.3.1

  # Connectivity stream for the offline indicator badge.
  # 7.x requires Xcode 26.1.1 (calls `NWPath.isUltraConstrained`, which
  # isn't declared in the SDK headers shipped on the current `macos-15`
  # GitHub runner). Hold at 6.x until the runner catches up.
  connectivity_plus: ^7.3.0

  # Internationalisation
  intl: any

  # Issue #150 — Noto Sans JP for consistent CJK rendering across OEMs.
  # `GoogleFonts.notoSansJpTextTheme` fetches the font on first use and
  # caches it to disk; offline boots fall back to the platform default,
  # matching the pre-#150 behaviour.
  google_fonts: ^8.1.0

# Pin transitive deps that break the build but aren't directly listed
# above. Remove an entry as soon as the upstream issue resolves.
dependency_overrides:
  # Transitive via `amplify_analytics_pinpoint`. 12.4.0 added an
  # `NSProcessInfo.isiOSAppOnVision` call guarded by
  # `@available(iOS 26.1, *)`, but the selector isn't declared in the
  # SDK headers shipped with the current `macos-15` GitHub runner's
  # Xcode, so the iOS simulator build fails with an ARC semantic
  # error. 12.3.0 predates that call. Drop this override when the
  # runner image ships an Xcode that knows the iOS 26.1 SDK, or when
  # device_info_plus removes the call.
  device_info_plus: 12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  # build_runner 2.9+ moved to `build ^4.0.0`, which is incompatible
  # with riverpod_generator 2.6.x. The newer freezed / json_serializable
  # majors are pulled back too so the build-runners stack stays
  # self-consistent until the Riverpod 3 migration.
  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5

  # Linting
  flutter_lints: ^6.0.0
  # custom_lint 0.8.x depends on analyzer ^8.0.0, which conflicts with
  # the analyzer ^7.0.0 that riverpod_lint 2.6.x needs. Hold custom_lint
  # at the 0.7.x line until the Riverpod 3 migration unsticks the lint
  # stack as a whole.
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5

  # App icon generation
  flutter_launcher_icons: ^0.14.4

  # Native splash screen generation
  flutter_native_splash: ^2.4.6

  # Testing
  mocktail: ^1.0.4
  fake_async: ^1.3.2
  sqflite_common_ffi: ^2.3.7+1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/branding/
    - assets/l10n/
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/icons/saso-compact-rounded-1024.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/saso-compact-rounded-1024.png"
    background_color: "#FFFFFF"
    theme_color: "#0D47A1"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/images/branding/saso-full-1024.png
  image_dark: assets/images/branding/saso-mono-1024.png
  android_12:
    image: assets/icons/saso-compact-rounded-1024.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#000000"
  ios: true
  android: true
  web: false
